<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Initial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Dynalight&family=Markazi+Text:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,900;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playball&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&family=Shojumaru&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap');

        body {
            display: flex;
            height: 90vh;
            justify-content: center;
            align-items: center;
        }

        .container {
            height: 80px;
            width: 400px;
            background-color: rgb(228, 228, 228);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 3px 3px 12px 2px rgb(196, 196, 196) ;
        }

        button {
            padding: 6.3px 10px;
            border: none;
            background-color: rgb(89, 202, 89);
            border-radius: 3px;
            font-family: Montserrat;
            font-weight: 600;
            color: white;
        }

        button:hover {
            transition: .2s;
            background-color: rgb(84, 190, 84);
        }

        input {
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            margin-right: 3px;
            font-family: Poppins;
        }

        input:focus {
            transition: .2s;
            outline: none;
            border: none;
            background-color: rgb(255, 255, 255);
        }

        #initial {
            font-family: Poppins;
        }

    </style>
</head>
<body>
    <div class="container">
        <input type="text" placeholder="type here">
        <button>Get Initial</button>
        <h1 id="initial">Initial: <span id="initial-result"></span></h1>
    </div>

</body>
